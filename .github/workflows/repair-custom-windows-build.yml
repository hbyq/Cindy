name: repair-custom-windows-build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage:
    if: ${{ github.repository == 'hbyq/Cindy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Materialize and stage the verified full workflow blob
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          work="$(mktemp -d)"
          source_file="$work/custom-windows-build.yml"
          source_url="https://raw.githubusercontent.com/hbyq/Cindy/be8b033ae7116d8d60178fe6a50716cb4286b63f/.github/workflows/custom-windows-build.yml"

          curl --fail --silent --show-error --location "$source_url" --output "$source_file"
          test "$(git hash-object "$source_file")" = "9da97cd5866e425ee91de35f416e40124bd26446"

          python3 - "$source_file" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          replacements = (
              ('0ed16b3947162e5446120a9146c011f1bf75dd48', '2af786b50024961a205060b351504c64bc4222fc'),
              ('c1cc8a9ddd30e166db7a172d065aee686eb22da2', '6984dda24f1c1bac29f14c3e6179fee2a234e78f'),
          )
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old}')
              text = text.replace(old, new)
          for old, new in replacements:
              if old in text or text.count(new) != 1:
                  raise SystemExit('SHA replacement verification failed')
          path.write_text(text, encoding='utf-8')
          PY

          test "$(wc -l < "$source_file")" -ge 1000
          grep -Fq "2af786b50024961a205060b351504c64bc4222fc" "$source_file"
          grep -Fq "6984dda24f1c1bac29f14c3e6179fee2a234e78f" "$source_file"
          ! grep -Fq "restore-guard" "$source_file"

          repo_dir="$work/repo"
          git init "$repo_dir"
          git -C "$repo_dir" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git -C "$repo_dir" fetch --depth=1 origin main
          git -C "$repo_dir" checkout -B main FETCH_HEAD
          mkdir -p "$repo_dir/.ci-staging"
          install -m 0644 "$source_file" "$repo_dir/.ci-staging/custom-windows-build.yml"

          git -C "$repo_dir" config user.name 'hbyq'
          git -C "$repo_dir" config user.email '51372765+hbyq@users.noreply.github.com'
          git -C "$repo_dir" add .ci-staging/custom-windows-build.yml
          git -C "$repo_dir" diff --cached --check
          if git -C "$repo_dir" diff --cached --quiet; then
            echo 'Verified staging blob already present.'
            exit 0
          fi
          git -C "$repo_dir" commit -s -m 'chore(ci): stage verified custom Windows workflow blob'
          git -C "$repo_dir" push origin HEAD:main
