name: custom-windows-build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      official_ref:
        description: "stable，或指定官方稳定标签（例如 v0.1.28）"
        required: true
        default: stable
        type: string
  schedule:
    - cron: "17 2 * * *"

# Fork-only build: the token cannot push code, create releases, or open PRs.
permissions:
  actions: read
  contents: read

concurrency:
  group: custom-windows-build-${{ github.event.inputs.official_ref || 'stable' }}
  cancel-in-progress: false

env:
  XDT_SKIP_AGENT_BIN_INSTALL: "1"
  NODE_OPTIONS: "--max-old-space-size=8192"

jobs:
  build:
    if: ${{ github.repository == 'hbyq/Cindy' }}
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Resolve official stable tag
        id: release
        shell: pwsh
        env:
          REQUESTED_REF: ${{ github.event.inputs.official_ref || 'stable' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $requested = $env:REQUESTED_REF.Trim()

          if ($requested -eq 'stable') {
            $cacheBust = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
            $manifest = Invoke-RestMethod -Uri "https://hotfix.cindy.app/cindy/manifest-win32-x64.json?t=$cacheBust"
            $version = [string]$manifest.app.version
            if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "Official stable manifest returned an invalid version: '$version'"
            }
            $officialRef = "v$version"
          } elseif ($requested -match '^v\d+\.\d+\.\d+$') {
            $officialRef = $requested
            $version = $requested.Substring(1)
          } else {
            throw "official_ref must be 'stable' or an official vX.Y.Z tag"
          }

          "official_ref=$officialRef" >> $env:GITHUB_OUTPUT
          "official_version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Official source: makecindy/cindy@$officialRef"

      - name: Checkout official Cindy source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: makecindy/cindy
          ref: ${{ steps.release.outputs.official_ref }}
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Verify and fetch the official protocol submodule
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedUrl = 'https://github.com/makecindy/cindy-protocol.git'
          $expectedPath = 'cindy-protocol'
          $actualUrl = (git config -f .gitmodules --get submodule.cindy-protocol.url).Trim()
          $actualPath = (git config -f .gitmodules --get submodule.cindy-protocol.path).Trim()
          if ($actualUrl -ne $expectedUrl -or $actualPath -ne $expectedPath) {
            throw "Unexpected cindy-protocol source: url='$actualUrl' path='$actualPath'"
          }
          git submodule sync -- cindy-protocol
          git submodule update --init --force --recursive -- cindy-protocol
          if ($LASTEXITCODE -ne 0) { throw 'Failed to fetch cindy-protocol' }

      - name: Apply the allow-listed translation commit
        id: compose
        shell: pwsh
        env:
          OFFICIAL_VERSION: ${{ steps.release.outputs.official_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $featureRef = 'refs/remotes/customization/feature/visible-text-translation'
          $featureUrl = 'https://github.com/hbyq/Cindy.git'
          git remote add customization $featureUrl
          git fetch --no-tags customization '+refs/heads/feature/visible-text-translation:refs/remotes/customization/feature/visible-text-translation'
          if ($LASTEXITCODE -ne 0) { throw 'Failed to fetch the translation branch' }

          $featureSha = (git rev-parse $featureRef).Trim()
          $parents = @((git show -s --format='%P' $featureSha).Trim() -split '\s+' | Where-Object { $_ })
          if ($parents.Count -ne 1) { throw 'The translation branch head must be a single-parent commit' }
          $baseSha = $parents[0]
          $officialSha = (git rev-parse HEAD).Trim()

          git merge-base --is-ancestor $baseSha $officialSha
          if ($LASTEXITCODE -ne 0) {
            throw "Translation base $baseSha is not an ancestor of official source $officialSha"
          }

          $commitCount = [int](git rev-list --count "$baseSha..$featureSha")
          if ($commitCount -ne 1) { throw "Expected exactly one translation commit, found $commitCount" }

          $message = git show -s --format='%B' $featureSha
          if (-not ($message -match '(?m)^Signed-off-by:\s+.+\s+<[^>]+>$')) {
            throw 'Translation commit is missing a DCO Signed-off-by trailer'
          }

          $allowedPaths = @(
            'apps/desktop/src/main/__tests__/visibleTextTranslationService.test.ts',
            'apps/desktop/src/main/bootstrap-electron.ts',
            'apps/desktop/src/main/visible-text-translation-settings-store.ts',
            'apps/desktop/src/main/visibleTextTranslationService.ts',
            'apps/desktop/src/preload/preload.ts',
            'apps/desktop/src/renderer/__tests__/thinkingTextRendering.test.tsx',
            'apps/desktop/src/renderer/__tests__/workGroupBlockLivePreview.test.tsx',
            'apps/desktop/src/renderer/components/chat/ThinkingCard.tsx',
            'apps/desktop/src/renderer/components/chat/WorkGroupBlock.tsx',
            'apps/desktop/src/renderer/hooks/useVisibleTextTranslation.ts',
            'apps/desktop/src/renderer/vite-env.d.ts',
            'apps/desktop/src/shared/__tests__/visibleTextTranslation.test.ts',
            'apps/desktop/src/shared/visibleTextTranslation.ts',
            'packages/maker-shared/src/workActivityProjection.ts'
          )
          $changedPaths = @(git diff-tree --no-commit-id --name-only -r $featureSha)
          $unexpectedPaths = @($changedPaths | Where-Object { $_ -notin $allowedPaths })
          if ($unexpectedPaths.Count -gt 0) {
            throw "Translation commit changed non-allow-listed paths: $($unexpectedPaths -join ', ')"
          }
          $missingPaths = @($allowedPaths | Where-Object { $_ -notin $changedPaths })
          if ($missingPaths.Count -gt 0) {
            throw "Translation commit is missing expected paths: $($missingPaths -join ', ')"
          }

          git config user.name 'hbyq'
          git config user.email '51372765+hbyq@users.noreply.github.com'
          git cherry-pick $featureSha
          if ($LASTEXITCODE -ne 0) {
            throw 'Translation commit conflicts with the selected official release'
          }

          $composedSha = (git rev-parse HEAD).Trim()
          $featureShort = $featureSha.Substring(0, 12)
          $artifactName = "cindy-visible-translation-$env:OFFICIAL_VERSION-$featureShort"
          "official_sha=$officialSha" >> $env:GITHUB_OUTPUT
          "feature_sha=$featureSha" >> $env:GITHUB_OUTPUT
          "composed_sha=$composedSha" >> $env:GITHUB_OUTPUT
          "artifact_name=$artifactName" >> $env:GITHUB_OUTPUT

      - name: Skip an unchanged scheduled build
        id: duplicate
        if: ${{ github.event_name == 'schedule' }}
        shell: pwsh
        env:
          ARTIFACT_NAME: ${{ steps.compose.outputs.artifact_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $encodedName = [Uri]::EscapeDataString($env:ARTIFACT_NAME)
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts?name=$encodedName&per_page=10"
          $response = Invoke-RestMethod -Headers $headers -Uri $uri
          $active = @($response.artifacts | Where-Object { -not $_.expired })
          $skip = $active.Count -gt 0
          "skip=$($skip.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($skip) { Write-Host "Artifact '$env:ARTIFACT_NAME' already exists; scheduled build skipped." }

      - name: Setup pnpm
        if: ${{ steps.duplicate.outputs.skip != 'true' }}
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          run_install: false

      - name: Setup Node.js
        if: ${{ steps.duplicate.outputs.skip != 'true' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        if: ${{ steps.duplicate.outputs.skip != 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: Install dependencies
        if: ${{ steps.duplicate.outputs.skip != 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Install bundled ripgrep
        if: ${{ steps.duplicate.outputs.skip != 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm install:ripgrep

      - name: Typecheck Desktop
        if: ${{ steps.duplicate.outputs.skip != 'true' }}
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: pnpm --filter desktop typecheck

      - name: Typecheck maker-shared when available
        if: ${{ steps.duplicate.outputs.skip != 'true' }}
        run: pnpm --filter "@cindy/maker-shared" run --if-present typecheck

      - name: Run translation tests
        if: ${{ steps.duplicate.outputs.skip != 'true' }}
        run: >-
          pnpm --filter desktop exec vitest run
          src/shared/__tests__/visibleTextTranslation.test.ts
          src/main/__tests__/visibleTextTranslationService.test.ts
          src/renderer/__tests__/thinkingTextRendering.test.tsx
          src/renderer/__tests__/workGroupBlockLivePreview.test.tsx
          src/renderer/__tests__/workActivityProjection.test.ts

      - name: Run complete unit test gate
        if: ${{ steps.duplicate.outputs.skip != 'true' }}
        run: pnpm test:unit

      - name: Build unsigned versionless Windows installer
        if: ${{ steps.duplicate.outputs.skip != 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm release:package -- --platform win32 --arch x64 --region global --no-sign

      - name: Write custom build provenance
        if: ${{ steps.duplicate.outputs.skip != 'true' }}
        shell: pwsh
        env:
          OFFICIAL_REF: ${{ steps.release.outputs.official_ref }}
          OFFICIAL_VERSION: ${{ steps.release.outputs.official_version }}
          OFFICIAL_SHA: ${{ steps.compose.outputs.official_sha }}
          FEATURE_SHA: ${{ steps.compose.outputs.feature_sha }}
          COMPOSED_SHA: ${{ steps.compose.outputs.composed_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactDir = 'apps/desktop/release/artifacts/global/unversioned/win32-x64'
          $provenance = [ordered]@{
            officialRepository = 'makecindy/cindy'
            officialRef = $env:OFFICIAL_REF
            officialVersion = $env:OFFICIAL_VERSION
            officialSha = $env:OFFICIAL_SHA
            customizationRepository = 'hbyq/Cindy'
            featureBranch = 'feature/visible-text-translation'
            featureSha = $env:FEATURE_SHA
            composedSha = $env:COMPOSED_SHA
            workflowRepository = $env:GITHUB_REPOSITORY
            workflowRunId = $env:GITHUB_RUN_ID
            workflowRunAttempt = $env:GITHUB_RUN_ATTEMPT
          }
          $provenance | ConvertTo-Json | Set-Content -Encoding utf8 "$artifactDir/custom-build-provenance.json"

      - name: Upload installer artifact
        if: ${{ steps.duplicate.outputs.skip != 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.compose.outputs.artifact_name }}
          path: |
            apps/desktop/release/artifacts/global/unversioned/win32-x64/cindy-unversioned-Setup.exe
            apps/desktop/release/artifacts/global/unversioned/win32-x64/build-info.json
            apps/desktop/release/artifacts/global/unversioned/win32-x64/custom-build-provenance.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
