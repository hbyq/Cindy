name: rebase-customizations-v0.1.76

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebase:
    if: ${{ github.repository == 'hbyq/Cindy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Rebase allow-listed customizations onto official v0.1.76
        env:
          OFFICIAL_REPO: https://github.com/makecindy/cindy.git
          OFFICIAL_TAG: v0.1.76
          EXPECTED_OFFICIAL_SHA: 0d1a5c7da95e22a1215dc5ad637bf60549453ee8
          TRANSLATION_SRC: 0ed16b3947162e5446120a9146c011f1bf75dd48
          UPDATE_SRC: c1cc8a9ddd30e166db7a172d065aee686eb22da2
        run: |
          set -euo pipefail
          git config user.name 'hbyq'
          git config user.email '51372765+hbyq@users.noreply.github.com'

          git remote add official "$OFFICIAL_REPO"
          git fetch --no-tags official "refs/tags/${OFFICIAL_TAG}:refs/tags/${OFFICIAL_TAG}"
          official_sha="$(git rev-parse "refs/tags/${OFFICIAL_TAG}^{commit}")"
          if [ "$official_sha" != "$EXPECTED_OFFICIAL_SHA" ]; then
            echo "Unexpected ${OFFICIAL_TAG} SHA: ${official_sha}" >&2
            exit 1
          fi

          git switch --detach "$official_sha"
          git cherry-pick --allow-empty=false "$TRANSLATION_SRC"
          git commit --amend -m "feat(desktop): rebase visible text translation onto v0.1.76

          (cherry picked from commit ${TRANSLATION_SRC})
          Signed-off-by: hbyq <51372765+hbyq@users.noreply.github.com>"
          translation_sha="$(git rev-parse HEAD)"

          git switch --detach "$official_sha"
          set +e
          git cherry-pick --allow-empty=false "$UPDATE_SRC"
          pick_status=$?
          set -e
          if [ "$pick_status" -ne 0 ]; then
            cat > /tmp/resolve_fixture.py <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path("apps/desktop/src/main/__tests__/updateService.test.ts")
          text = path.read_text()
          pattern = (
              r"<<<<<<< HEAD\n"
              r"  resetUpdateServiceFixture\(\);\n"
              r"=======\n"
              r"  fs\.rmSync\(TEST_ROOT, \{ recursive: true, force: true, maxRetries: 5, retryDelay: 100 \}\);\n"
              r">>>>>>> [^\n]+\n"
          )
          replaced, count = re.subn(pattern, "  resetUpdateServiceFixture();\n", text, count=1)
          if count != 1 or "<<<<<<<" in replaced or ">>>>>>>" in replaced:
              sys.stderr.write("expected fixture conflict not resolved\n")
              sys.exit(1)
          path.write_text(replaced)
          print("resolved updateService fixture conflict")
          PY
            python3 /tmp/resolve_fixture.py
            git add -- apps/desktop/src/main/__tests__/updateService.test.ts
            GIT_EDITOR=true git cherry-pick --continue
          fi
          git commit --amend -m "feat(fork): rebase updater and build support onto v0.1.76

          Preserve the v0.1.76 platform-aware Beta capability checks while retaining fork feed binding and version monotonicity.

          (cherry picked from commit ${UPDATE_SRC})
          Signed-off-by: hbyq <51372765+hbyq@users.noreply.github.com>"
          update_sha="$(git rev-parse HEAD)"

          if [ "$(git rev-parse "${translation_sha}^")" != "$official_sha" ]; then
            echo "translation parent is not official tag" >&2
            exit 1
          fi
          if [ "$(git rev-parse "${update_sha}^")" != "$official_sha" ]; then
            echo "update parent is not official tag" >&2
            exit 1
          fi

          git switch -C main origin/main
          git merge --no-ff -s ours \
            -m "chore(ci): retain v0.1.76 customization commits

          Keep the reviewed single-parent customization commits reachable from main without applying their source tree to the workflow branch.

          Signed-off-by: hbyq <51372765+hbyq@users.noreply.github.com>" \
            "$translation_sha" "$update_sha"

          cat > /tmp/retarget_shas.py <<PY
          from pathlib import Path
          path = Path(".github/workflows/custom-windows-build.yml")
          text = path.read_text()
          text = text.replace("0ed16b3947162e5446120a9146c011f1bf75dd48", "${translation_sha}")
          text = text.replace("c1cc8a9ddd30e166db7a172d065aee686eb22da2", "${update_sha}")
          if "${translation_sha}" not in text or "${update_sha}" not in text:
              raise SystemExit("failed to retarget customization SHAs")
          path.write_text(text)
          PY
          python3 /tmp/retarget_shas.py
          git rm --ignore-unmatch -- .github/workflows/rebase-customizations-v0.1.76.yml
          git add -- .github/workflows/custom-windows-build.yml
          git commit -m "fix(ci): rebase custom Windows build onto v0.1.76

          Retain the two reviewed customization commits through main and fetch them by immutable SHA, avoiding extra remote feature refs.

          Signed-off-by: hbyq <51372765+hbyq@users.noreply.github.com>"

          echo "translation_sha=${translation_sha}"
          echo "update_sha=${update_sha}"
          echo "main_head=$(git rev-parse HEAD)"
          git log -5 --format='%H %P %s'
          git push origin HEAD:refs/heads/main
