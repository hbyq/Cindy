name: rebase-customizations-v0.1.76

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    if: ${{ github.repository == 'hbyq/Cindy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Restore workflow from last good revision and pin new SHAs
        run: |
          set -euo pipefail
          git config user.name 'hbyq'
          git config user.email '51372765+hbyq@users.noreply.github.com'

          good_rev=be8b033ae7116d8d60178fe6a50716cb4286b63f
          translation_sha=2af786b50024961a205060b351504c64bc4222fc
          update_sha=6984dda24f1c1bac29f14c3e6179fee2a234e78f
          workflow_path=.github/workflows/custom-windows-build.yml

          git cat-file -e "${good_rev}:${workflow_path}"
          git show "${good_rev}:${workflow_path}" > "$workflow_path"

          python3 - "$workflow_path" "$translation_sha" "$update_sha" <<'PY'
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          translation_sha = sys.argv[2]
          update_sha = sys.argv[3]
          text = path.read_text()
          text = text.replace('0ed16b3947162e5446120a9146c011f1bf75dd48', translation_sha)
          text = text.replace('c1cc8a9ddd30e166db7a172d065aee686eb22da2', update_sha)
          if translation_sha not in text or update_sha not in text:
              raise SystemExit('failed to pin customization SHAs')
          if '0ed16b3947162e5446120a9146c011f1bf75dd48' in text or 'c1cc8a9ddd30e166db7a172d065aee686eb22da2' in text:
              raise SystemExit('old customization SHAs remain')
          if 'RESTORE_FROM_DISK' in text or 'PLACEHOLDER' in text:
              raise SystemExit('restored workflow still looks like a placeholder')
          path.write_text(text)
          PY

          git rm --ignore-unmatch -- .github/workflows/rebase-customizations-v0.1.76.yml
          git add -- "$workflow_path"
          git commit -m "fix(ci): restore custom Windows build workflow and pin v0.1.76 SHAs

          Restore the last good workflow definition and fetch the reviewed v0.1.76 customization commits by immutable SHA.

          Signed-off-by: hbyq <51372765+hbyq@users.noreply.github.com>"
          git push origin HEAD:refs/heads/main
          git log -3 --format='%H %s'
