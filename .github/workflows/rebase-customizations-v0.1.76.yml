name: rebase-customizations-v0.1.76

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    if: ${{ github.repository == 'hbyq/Cindy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Restore complete workflow and pin reviewed v0.1.79 SHAs
        run: |
          set -euo pipefail
          git config user.name 'hbyq'
          git config user.email '51372765+hbyq@users.noreply.github.com'

          good_rev=612a1bd62e7e89ab69449eb095cd14b9dd17a0b5
          translation_sha=3ed8a221a47a4482b7e102b8bbc7e1b0de2bbe16
          update_sha=6d9dd6a42190be64fbab7539d8a7b83bb0bbcf60
          workflow_path=.github/workflows/custom-windows-build.yml

          git cat-file -e "${good_rev}:${workflow_path}"
          git show "${good_rev}:${workflow_path}" > "$workflow_path"

          python3 - "$workflow_path" "$translation_sha" "$update_sha" <<'PY'
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          translation_sha = sys.argv[2]
          update_sha = sys.argv[3]
          text = path.read_text()
          text = text.replace('2af786b50024961a205060b351504c64bc4222fc', translation_sha)
          text = text.replace('6984dda24f1c1bac29f14c3e6179fee2a234e78f', update_sha)
          if translation_sha not in text or update_sha not in text:
              raise SystemExit('failed to pin customization SHAs')
          if '2af786b50024961a205060b351504c64bc4222fc' in text or '6984dda24f1c1bac29f14c3e6179fee2a234e78f' in text:
              raise SystemExit('old customization SHAs remain')
          if 'PLACEHOLDER' in text or len(text.splitlines()) < 1000:
              raise SystemExit('restored workflow still looks incomplete')
          path.write_text(text)
          PY

          git add -- "$workflow_path"
          git commit -m "fix(ci): restore Windows build workflow and pin v0.1.79 SHAs

          Restore the complete custom Windows build workflow and cherry-pick the reviewed v0.1.79 customization commits.

          Signed-off-by: hbyq <51372765+hbyq@users.noreply.github.com>"
          git push origin HEAD:refs/heads/main
          git log -3 --format='%H %s'
