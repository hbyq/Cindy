name: prepare-cindy-workflow-repair
on:
  push:
    branches: [main]
    paths: [.github/workflows/prepare-cindy-workflow-repair.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: ${{ github.repository == 'hbyq/Cindy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare and verify an unattached recovery blob
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
          python3 <<'PY'
          import copy, hashlib, json, os, pathlib, subprocess, tempfile, textwrap, urllib.request
          import yaml

          root = pathlib.Path(tempfile.mkdtemp(prefix='cindy-workflow-', dir=os.environ['RUNNER_TEMP']))
          url = 'https://raw.githubusercontent.com/hbyq/Cindy/612a1bd62e7e89ab69449eb095cd14b9dd17a0b5/.github/workflows/custom-windows-build.yml'
          with urllib.request.urlopen(url, timeout=30) as response:
              original = response.read()
          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          if blob_sha(original) != 'f25ff249d9524fae1561a7ed1b2881542910f299':
              raise SystemExit('Recovery source blob mismatch')
          text = original.decode('utf-8')
          if len(text.splitlines()) != 1072:
              raise SystemExit('Recovery source line count mismatch')
          start = text.index("          $featureUrl = 'https://github.com/hbyq/Cindy.git'")
          end = text.index("\n          git config user.name", start)
          old = text[start:end]
          if old.count('2af786b50024961a205060b351504c64bc4222fc') != 1 or old.count('6984dda24f1c1bac29f14c3e6179fee2a234e78f') != 1:
              raise SystemExit('Unexpected customization block')
          replacement = textwrap.indent(textwrap.dedent(r'''
          $featureUrl = 'https://github.com/hbyq/Cindy.git'
          # Read data from the commit that triggered this run, never moving main.
          $customizationRef = $env:GITHUB_SHA
          if ($customizationRef -cnotmatch '^[a-f0-9]{40}\z') {
            throw 'Invalid workflow commit SHA'
          }
          git remote add customization $featureUrl
          if ($LASTEXITCODE -ne 0) { throw 'Failed to add customization remote' }
          git fetch --no-tags customization $customizationRef
          if ($LASTEXITCODE -ne 0) { throw 'Failed to fetch pinned fork history' }
          $pinLines = @(git show "${customizationRef}:.github/cindy-customizations.json")
          if ($LASTEXITCODE -ne 0) { throw 'Missing customization pin configuration' }
          $pins = ($pinLines -join "`n") | ConvertFrom-Json -AsHashtable
          if ($pins -isnot [System.Collections.IDictionary] -or $pins.Count -ne 3 -or
              $pins.schemaVersion -isnot [long] -or $pins.schemaVersion -ne 1) {
            throw 'Invalid customization pin schema'
          }
          $translationRef = $pins.translationSha
          $updateRef = $pins.updateSha
          foreach ($featureSha in @($translationRef, $updateRef)) {
            if ($featureSha -isnot [string] -or $featureSha -cnotmatch '^[a-f0-9]{40}\z') {
              throw 'Customization pins must be full lowercase commit SHAs'
            }
            git merge-base --is-ancestor $featureSha $customizationRef
            if ($LASTEXITCODE -ne 0) {
              throw "Customization commit $featureSha is not retained by the workflow commit"
            }
          }
          '''), '          ').strip('\n') + '\n'
          text = text[:start] + replacement + text[end:]
          before = yaml.safe_load(original)
          after = yaml.safe_load(text)
          expected = copy.deepcopy(before)
          old_step = next(s for s in expected['jobs']['build']['steps'] if s.get('id') == 'compose')
          old_step['run'] = old_step['run'].replace(textwrap.dedent(old), textwrap.dedent(replacement))
          if after != expected:
              raise SystemExit('Unexpected edits outside the customization block')
          if set(after['jobs']) != {'build', 'publish', 'cleanup-handoff', 'report-status'}:
              raise SystemExit('Incomplete job graph')
          if after['jobs']['build']['permissions']['contents'] != 'read':
              raise SystemExit('Build token must stay read-only')
          ps_scripts = [s['run'] for job in after['jobs'].values() for s in job.get('steps', []) if s.get('shell') == 'pwsh' and 'run' in s]
          scripts_path = root / 'scripts.json'
          scripts_path.write_text(json.dumps(ps_scripts), encoding='utf-8')
          parser = root / 'parse.ps1'
          parser.write_text('''$ErrorActionPreference = 'Stop'
          $scripts = Get-Content -Raw -LiteralPath $args[0] | ConvertFrom-Json
          foreach ($script in $scripts) {
            $tokens = $null; $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseInput($script, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
          $pins = '{"schemaVersion":1,"translationSha":"3ed8a221a47a4482b7e102b8bbc7e1b0de2bbe16","updateSha":"6d9dd6a42190be64fbab7539d8a7b83bb0bbcf60"}' | ConvertFrom-Json -AsHashtable
          if ($pins.schemaVersion -isnot [long]) { throw 'Unexpected JSON integer type' }
          Write-Host "Parsed $($scripts.Count) PowerShell scripts successfully"
          ''', encoding='utf-8')
          subprocess.run(['pwsh', '-NoProfile', '-File', str(parser), str(scripts_path)], check=True)
          encoded = text.encode('utf-8')
          request = root / 'blob.json'
          request.write_text(json.dumps({'content': text, 'encoding': 'utf-8'}), encoding='utf-8')
          result = subprocess.run(['gh', 'api', '--method', 'POST', 'repos/hbyq/Cindy/git/blobs', '--input', str(request)], check=True, text=True, capture_output=True)
          sha = json.loads(result.stdout)['sha']
          if sha != blob_sha(encoded):
              raise SystemExit('Uploaded recovery blob checksum mismatch')
          print(f'REPAIR_BLOB_SHA={sha}')
          print(f'REPAIR_BYTES={len(encoded)} REPAIR_LINES={len(text.splitlines())}')
          print('Verified: only pin loading changed; all tests, packaging, publication and permissions preserved.')
          PY
